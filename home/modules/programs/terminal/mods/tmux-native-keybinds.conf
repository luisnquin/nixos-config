keybind = ctrl+b>c=new_tab
keybind = ctrl+b>ctrl+b=text:\x02
keybind = ctrl+b>shift+digit_5=new_split:right
keybind = ctrl+b>shift+digit_2=new_split:down
keybind = ctrl+b>backquote=new_split:right
keybind = ctrl+b>intl_backslash=new_split:left
keybind = ctrl+b>slash=new_split:down
keybind = ctrl+b>shift+slash=new_split:up
keybind = ctrl+b>v=new_split:right
keybind = ctrl+b>s=new_split:down
keybind = ctrl+b>shift+7=close_tab:this
keybind = ctrl+b>n=next_tab
keybind = ctrl+b>p=previous_tab
keybind = ctrl+b>o=goto_split:next
keybind = ctrl+b>semicolon=goto_split:previous
keybind = ctrl+b>h=goto_split:left
keybind = ctrl+b>j=goto_split:down
keybind = ctrl+b>k=goto_split:up
keybind = ctrl+b>l=goto_split:right
keybind = ctrl+b>ctrl+h=goto_split:left
keybind = ctrl+b>ctrl+j=goto_split:down
keybind = ctrl+b>ctrl+k=goto_split:up
keybind = ctrl+b>ctrl+l=goto_split:right
keybind = ctrl+b>arrow_left=goto_split:left
keybind = ctrl+b>arrow_right=goto_split:right
keybind = ctrl+b>arrow_up=goto_split:up
keybind = ctrl+b>arrow_down=goto_split:down
keybind = ctrl+b>shift+h=resize_split:left,5
keybind = ctrl+b>shift+j=resize_split:down,5
keybind = ctrl+b>shift+k=resize_split:up,5
keybind = ctrl+b>shift+l=resize_split:right,5
keybind = ctrl+b>shift+comma=move_tab:-1
keybind = ctrl+b>shift+period=move_tab:1
keybind = ctrl+b>z=toggle_split_zoom
keybind = ctrl+b>x=close_surface
keybind = ctrl+b>w=toggle_tab_overview
keybind = ctrl+b>r=reload_config
keybind = ctrl+b>comma=prompt_tab_title
keybind = ctrl+b>1=goto_tab:1
keybind = ctrl+b>2=goto_tab:2
keybind = ctrl+b>3=goto_tab:3
keybind = ctrl+b>4=goto_tab:4
keybind = ctrl+b>5=goto_tab:5
keybind = ctrl+b>6=goto_tab:6
keybind = ctrl+b>7=goto_tab:7
keybind = ctrl+b>8=goto_tab:8
keybind = ctrl+b>9=last_tab
