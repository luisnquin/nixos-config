[package]
name = "hark"
version = "0.1.0"
edition = "2021"
description = "notification centre over mako's history"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
