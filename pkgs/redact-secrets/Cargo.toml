[package]
name = "redact-secrets"
version = "0.1.0"
edition = "2021"
description = "Runs a shell command with secrets masked out of its stdout and stderr"
license = "MIT"

[dependencies]
nix = { version = "0.30", default-features = false, features = ["signal"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
lto = true
strip = true
