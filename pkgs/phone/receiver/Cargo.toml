[package]
name = "phone"
version = "0.1.0"
edition = "2021"

# Its own root; the controller crate one directory up is an implicit workspace.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

[build-dependencies]
cc = "1.2"

[profile.release]
lto = true
strip = true
