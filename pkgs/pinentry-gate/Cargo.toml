[package]
name = "pinentry-gate"
version = "0.1.0"
edition = "2021"
description = "a pinentry that asks on every surface at once"
license = "MIT"

[dependencies]
ttycanvas = { path = "../ttycanvas", features = ["audio"] }
base64 = "0.22"
linux-raw-sys = { version = "0.12", default-features = false, features = ["ioctl"] }
rustix = { version = "1", features = ["event", "fs", "process", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.3", default-features = false }

[dev-dependencies]
rustix = { version = "1", features = ["pty"] }

[profile.release]
strip = true
